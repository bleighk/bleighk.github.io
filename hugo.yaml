baseURL: https://bleighk.github.io/
locale: en-AU
title: Brad Knight
theme: github.com/adityatelange/hugo-PaperMod

paginate: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

params:
  env: production
  title: Brad Knight
  description: "Strategy and applied AI at Xero. Ex-BCG and Deloitte."
  author: Brad Knight

  # --- Home page (profile mode — shows photo) ---
  profileMode:
    enabled: true
    title: "Brad Knight"
    subtitle: "Strategy and applied AI at Xero. Ex-BCG and Deloitte."
    imageUrl: "/images/avatar.jpg"
    imageWidth: 200
    imageHeight: 200
    imageTitle: "Brad Knight"
    buttons:
      - name: Projects
        url: /projects/
      - name: Resume
        url: /brad-knight-resume.pdf

  # --- Social icons ---
  socialIcons:
    - name: github
      url: https://github.com/bleighk
    - name: linkedin
      url: https://www.linkedin.com/in/bradleyknight/

  # --- Display settings ---
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # --- Assets ---
  assets:
    favicon: /images/favicon.ico
    favicon16x16: /images/favicon-16x16.png
    favicon32x32: /images/favicon-32x32.png

  # --- Cover images ---
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: resume
      name: Resume
      url: /brad-knight-resume.pdf
      weight: 20

markup:
  goldmark:
    renderer:
      unsafe: true  # allows raw HTML in content (Loom embeds etc.)
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
