baseURL: https://bleighk.github.io/
locale: en-AU
title: Brad Knight
theme: github.com/adityatelange/hugo-PaperMod

paginate: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON  # required for PaperMod search

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

params:
  env: production
  title: Brad Knight
  description: >-
    Strategy and applied AI — part strategist, part builder, part translator
    between the two.
  author: Brad Knight

  # --- Home page (homeInfoParams mode) ---
  homeInfoParams:
    Title: "Brad Knight"
    Content: >-
      I work at the intersection of strategy and applied AI — a consulting-trained
      architect (BCG, Deloitte) who now builds and ships AI agents for non-engineering
      business problems. Part strategist, part builder, part translator between the two.


      Currently at Xero: strategy ops delegate on the company-wide AI transformation,
      and building production agents that cut weeks of manual work to minutes.

  # --- Social icons ---
  socialIcons:
    - name: github
      url: https://github.com/bleighk
    - name: linkedin
      url: https://www.linkedin.com/in/bradleyknight2/
    - name: rss
      url: /index.xml

  # --- Display settings ---
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # --- Search ---
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys:
      - title
      - permalink
      - summary
      - content

  # --- Assets ---
  assets:
    favicon: /images/favicon.ico
    favicon16x16: /images/favicon-16x16.png
    favicon32x32: /images/favicon-32x32.png

  # --- Cover images ---
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 30
    - identifier: now
      name: Now
      url: /now/
      weight: 40
    - identifier: search
      name: "🔍"
      url: /search/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true  # allows raw HTML in content (needed for Loom embeds)
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
